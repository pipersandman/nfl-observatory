name: Update NFL Data

on:
  schedule:
    # Run every Tuesday at 6am UTC (1am EST) - after Monday Night Football
    - cron: '0 6 * * 2'
    # Tuesday ~12pm PT - Football Zebras usually posts crew assignments 9-10am PT
    - cron: '0 19 * * 2'
    # Wednesday 8am PT - backstop in case assignments post late
    - cron: '0 15 * * 3'
  workflow_dispatch:
    # Manual trigger option (no longer needs checkbox - always full)
  push:
    # Deploy automatically whenever code is merged to main.
    # Data-only commits (including the bot's weekly commit) don't retrigger.
    branches: [main]
    paths-ignore:
      - 'frontend/data/**'

# Least privilege: the job only needs to commit data back to this repo
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4 (pinned to a commit)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned to a commit)
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch crew assignments (Football Zebras)
        # Never blocks the update: previews just show "Crew TBA" if this fails
        continue-on-error: true
        run: python scripts/fetch_assignments.py

      - name: Run data update (full rebuild)
        run: python scripts/update_data.py --full

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/data/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🏈 Update NFL data - $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Cache-bust CSS/JS/icons (deploy copy only, not committed)
        # Browsers cache styles.css and app.js aggressively. Stamping each deploy's
        # commit into the URLs (styles.css?v=abc1234) forces every visitor to get
        # the new files together with the new page.
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E \
            -e "s#(href=\"css/styles\.css)(\?v=[^\"]*)?\"#\1?v=${V}\"#" \
            -e "s#(src=\"js/app\.js)(\?v=[^\"]*)?\"#\1?v=${V}\"#" \
            -e "s#(favicon\.svg)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            -e "s#(favicon\.ico)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            -e "s#(favicon-32\.png)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            -e "s#(apple-touch-icon\.png)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            frontend/index.html
          grep -nE "styles\.css|app\.js|favicon" frontend/index.html

      - name: Deploy to HostGator
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65  # v4.3.5 (pinned: this step receives the FTP password)
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Encrypt the connection (plain FTP sends the password unencrypted)
          protocol: ftps
          local-dir: ./frontend/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/_*.csv
