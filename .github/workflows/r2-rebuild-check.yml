name: R2 rebuild check

# Manual only (Actions tab -> R2 rebuild check -> Run workflow, enter a run id from
# "Update NFL Data"). Rebuilds that run's site data from the raw files in nflobs-raw
# alone and compares it with what the run committed (#88). Read-only.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of an "Update NFL Data" run (the number in its URL)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history, to find the run's commits)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild and compare
        env:
          RUN_ID: ${{ inputs.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/rebuild_from_raw.py --run "$RUN_ID"
