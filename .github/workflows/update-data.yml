name: Update NFL Data

on:
  schedule:
    # Run every Tuesday at 6am UTC (1am EST) - after Monday Night Football
    - cron: '0 6 * * 2'
    # Tuesday ~12pm PT - Football Zebras usually posts crew assignments 9-10am PT
    - cron: '0 19 * * 2'
    # Wednesday 8am PT - backstop in case assignments post late
    - cron: '0 15 * * 3'
    # Game days: hourly while results come in (nflverse posts play-by-play ~1-3 hours
    # after each game). Each run checks for new play-by-play first and stops in under a
    # minute if there's nothing new. Times are UTC and cover both daylight and standard time.
    - cron: '0 3-9 * * 5'       # Thursday night game (Thu evening PT)
    - cron: '0 15-23 * * 0'     # Sunday: international morning games through the late games
    - cron: '0 0-9 * * 1'       # Sunday night game
    - cron: '0 2-5,7-9 * * 2'   # Monday night game (06:00 Tuesday is the weekly run above)
    # Crew-change checks (#142): go ahead only if the Football Zebras post (or play-by-play)
    # changed, so Friday and Saturday crew swaps reach the site before Sunday's games.
    - cron: '0 15 * * 6'        # Saturday morning ET
    - cron: '0 12 * * 0'        # Sunday, before the international morning games
  workflow_dispatch:
    # Manual trigger option (no longer needs checkbox - always full)
  push:
    # Deploy automatically whenever code is merged to main.
    # Data-only commits (including the bot's weekly commit) don't retrigger.
    branches: [main]
    paths-ignore:
      - 'frontend/data/**'

# Least privilege: the job only needs to commit data back to this repo
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for new play-by-play (game-day runs only)
        # Game-day runs continue only if nflverse has published new play-by-play since the last
        # update; every other run (weekly, manual, code merges) always continues. The season
        # watched is nflverse's current season (scripts/seasons.py, same rule as update_data.py).
        # Until that season's file exists (opening week), game-day runs skip; weekly, manual and
        # push runs still go ahead, and update_data.py stops red if the file is still missing.
        # A game-day run that would skip also checks the Football Zebras posts of the two
        # latest assignment files (#142): a post modified after the saved time means a crew
        # may have changed, so the run goes ahead (fetch_assignments.py refetches it).
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, re, sys, urllib.request, datetime as dt
          sys.path.insert(0, 'scripts')
          from seasons import nflverse_current_season
          GAMEDAY = {'0 3-9 * * 5', '0 15-23 * * 0', '0 0-9 * * 1', '0 2-5,7-9 * * 2', '0 15 * * 6', '0 12 * * 0'}
          FZ_API = 'https://www.footballzebras.com/wp-json/wp/v2/posts?slug={}&_fields=modified_gmt'
          FZ_UA = 'NFLOfficiatingObservatory/1.0 (+https://nflobservatory.com; weekly crew-assignment check)'
          def fz_updated():
              """(file, saved, now) for the first of the two latest assignment files whose post
              changed since it was saved, else None. A failed check never counts as a change."""
              for path in sorted(glob.glob('frontend/data/assignments/*-week-*.json'))[-2:]:
                  try:
                      src = json.load(open(path, encoding='utf-8')).get('source') or {}
                      saved, slug = src.get('modified'), (src.get('url') or '').rstrip('/').rsplit('/', 1)[-1]
                      if not saved or not re.fullmatch(r'[a-z0-9-]{1,120}', slug):
                          continue
                      req = urllib.request.Request(FZ_API.format(slug), headers={'User-Agent': FZ_UA})
                      mod = json.load(urllib.request.urlopen(req, timeout=15))[0]['modified_gmt'] + 'Z'
                      if mod > saved:
                          return os.path.basename(path), saved, mod
                  except Exception as e:
                      print(f'Could not check Football Zebras for {os.path.basename(path)} ({type(e).__name__}); not counted as a change')
              return None
          now = dt.datetime.now(dt.timezone.utc).replace(tzinfo=None)
          season = nflverse_current_season(now.date())
          stamp_path = 'frontend/data/source_stamp.json'
          try:
              old = json.load(open(stamp_path)).get('pbp')
          except Exception:
              old = None
          new = None
          checked = False
          try:
              req = urllib.request.Request('https://api.github.com/repos/nflverse/nflverse-data/releases/tags/pbp',
                                           headers={**({'Authorization': f"Bearer {os.environ['GH_TOKEN']}"} if os.environ.get('GH_TOKEN') else {}), 'Accept': 'application/vnd.github+json'})
              rel = json.load(urllib.request.urlopen(req, timeout=30))
              new = next((a['updated_at'] for a in rel.get('assets', []) if a['name'] == f'play_by_play_{season}.parquet'), None)
              checked = True
          except Exception as e:
              print(f'Could not check nflverse ({e}); continuing with the update')
          gameday = os.environ.get('EVENT') == 'schedule' and os.environ.get('SCHEDULE') in GAMEDAY
          unpublished = checked and new is None
          skip = checked and gameday and (new is None or new == old)
          fz = fz_updated() if skip else None
          if fz:
              skip = False
          if unpublished:
              why = ('not published yet, skipping' if skip else 'not published yet' if fz
                     else 'not published yet, updating anyway (not a game-day run)')
          else:
              why = 'no new games, skipping' if skip else 'no new games' if fz else 'updating'
          print(f'play-by-play {season}: last used {old}, now {new} -> {why}')
          if fz:
              print(f'Football Zebras {fz[0]}: post modified {fz[2]}, saved {fz[1]} -> updating (crews may have changed)')
          if new:
              json.dump({'pbp': new, 'checkedAt': now.isoformat(timespec='seconds') + 'Z'}, open(stamp_path, 'w'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          EOF

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Fetch crew assignments (Football Zebras)
        if: steps.gate.outputs.skip != 'true'
        # Never blocks the update: previews just show "Crew TBA" if this fails
        continue-on-error: true
        env:
          # Raw capture to R2 (#88). Only these two steps get the R2 secrets.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/fetch_assignments.py

      - name: Run data update (full rebuild)
        id: update
        if: steps.gate.outputs.skip != 'true'
        # Exit 3 = one or more modules failed, everything else was written: commit and
        # deploy what worked, then "Fail if any module failed" turns the run red.
        # Exit 1 = a source failed to load (nothing written) or a core file failed:
        # this step fails, so commit, build and deploy are all skipped.
        env:
          # Raw capture to R2 (#88). Only these two steps get the R2 secrets.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: python scripts/update_data.py --full || [ $? -eq 3 ]

      - name: Commit and push if changes
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/data/
          git add reports/miner/ 2>/dev/null || true
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🏈 Update NFL data - $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Build static pages for search engines and AI (deploy copy only, not committed)
        if: steps.gate.outputs.skip != 'true'
        # Pre-renders /crew/, /team/, /assignments/, /trends/, /guide/, /dataset/, sitemap.xml,
        # llms.txt, CSV downloads and the home page summary from this run's data
        run: python scripts/build_static.py

      - name: Cache-bust CSS/JS/icons (deploy copy only, not committed)
        if: steps.gate.outputs.skip != 'true'
        # Browsers cache styles.css and app.js aggressively. Stamping each deploy's
        # commit into the URLs (styles.css?v=abc1234) forces every visitor to get
        # the new files together with the new page.
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E \
            -e "s#(href=\"css/styles\.css)(\?v=[^\"]*)?\"#\1?v=${V}\"#" \
            -e "s#(src=\"js/app\.js)(\?v=[^\"]*)?\"#\1?v=${V}\"#" \
            -e "s#(href=\"css/static\.css)(\?v=[^\"]*)?\"#\1?v=${V}\"#" \
            -e "s#(favicon\.svg)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            -e "s#(favicon\.ico)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            -e "s#(favicon-32\.png)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            -e "s#(apple-touch-icon\.png)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            frontend/index.html
          sed -i -E "s#(src=\"js/livestrip\.js)(\?v=[^\"]*)?\"#\1?v=${V}\"#" frontend/index.html
          sed -i -E \
            -e "s#(href=\"/css/(styles|static|gameday)\.css)(\?v=[^\"]*)?\"#\1?v=${V}\"#g" \
            -e "s#(src=\"/js/gameday\.js)(\?v=[^\"]*)?\"#\1?v=${V}\"#" \
            frontend/gameday/index.html
          grep -nE "styles\.css|app\.js|livestrip\.js|favicon" frontend/index.html
          grep -nE "\.css|\.js" frontend/gameday/index.html

      - name: Deploy to HostGator
        if: steps.gate.outputs.skip != 'true'
        # Pinned to a commit: this step receives the FTP password
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287  # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Encrypt the connection (plain FTP sends the password unencrypted)
          protocol: ftps
          local-dir: ./frontend/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/_*.csv

      - name: Fail if any module failed
        if: steps.gate.outputs.skip != 'true'
        # Runs after the deploy, so the outputs that worked are already published.
        # Reads run_status.json (written by update_data.py) and ends the run red
        # if any module failed or was skipped, or raw capture has failed for over 24 hours (#88).
        env:
          RUN_STATUS: frontend/data/run_status.json
        run: |
          python - <<'EOF'
          import json, os, sys
          s = json.load(open(os.environ['RUN_STATUS'], encoding='utf-8'))
          bad = [f"{n}: {m['status']} ({m.get('error') or m.get('reason') or 'no detail'})"
                 for n, m in s.get('modules', {}).items() if m.get('status') != 'ok']
          rc = s.get('rawCapture') or {}
          if rc.get('stale'):
              bad.append(f"raw capture: failing for {rc.get('failingHours')} h since "
                         f"{rc.get('lastSuccess') or rc.get('failingSince')} ({rc.get('error')})")
          if s.get('ok') is True and not bad:
              print('All modules OK')
              sys.exit(0)
          print('Modules failed or skipped, or raw capture has been failing for over 24 hours (see run_status.json):')
          for b in bad:
              print('  -', b)
          sys.exit(1)
          EOF
