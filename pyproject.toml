# Tool settings only. This repo is not an installable package.

[tool.ruff]
target-version = "py311"
include = ["scripts/**/*.py"]

[tool.ruff.lint]
# Basic checks only for now: pyflakes (unused imports and variables, undefined
# names, empty f-strings) and syntax errors. Formatting and wider style rules
# are deferred to their own issue (decided in #74).
select = ["F", "E9"]
