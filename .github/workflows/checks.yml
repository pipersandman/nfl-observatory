name: Checks

# Runs scripts/check.py on every pull request. The job name "checks" is the
# status check the main ruleset will require once the data bot pushes as a
# GitHub App (see plan section 28 step 5).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            scripts/requirements-dev.txt
            scripts/requirements.txt

      - name: Install check tools and runtime packages
        # The tests (pytest, #89) import the pipeline modules, so they need the
        # runtime lock file too. No network or secrets are used by the checks.
        run: pip install -r scripts/requirements-dev.txt -r scripts/requirements.txt

      - name: Run checks
        run: python scripts/check.py
