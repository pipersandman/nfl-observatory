<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NFL Officiating Observatory: a thrown penalty flag -->
  <rect width="64" height="64" rx="14" fill="#16181b"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <g transform="rotate(-18 32 32)">
    <!-- cloth: square-ish with a rippled trailing edge -->
    <path d="M20 18 H44 C47 24, 43 29, 46 34 C48 39, 44 43, 46 46 H20 Z" fill="#ffc400"/>
    <!-- ripple shading -->
    <path d="M37 18 H44 C47 24, 43 29, 46 34 C48 39, 44 43, 46 46 H39 C41 41, 39 37, 40 32 C41 27, 38 23, 37 18 Z" fill="#e3a600"/>
    <!-- knot gathering the corner -->
    <circle cx="20" cy="46" r="7" fill="#ffd84d"/>
    <circle cx="20" cy="46" r="7" fill="none" stroke="#b88600" stroke-width="2"/>
  </g>
</svg>
