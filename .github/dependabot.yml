# Weekly pull requests when a dependency or a GitHub Action has an update or a
# security fix. Review and merge like any other PR.
version: 2
updates:
  # Python packages in scripts/. "uv" (not "pip") because requirements.txt is a
  # lock file generated by `uv pip compile --universal` from requirements.in;
  # Dependabot reruns that command, which keeps the Windows-only packages
  # (tzdata, colorama). Also updates requirements-dev.txt.
  - package-ecosystem: "uv"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    groups:
      # boto3 releases almost daily and moves botocore and s3transfer with it
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
    ignore:
      # numpy 2.5+ needs Python 3.12; our lock's floor is 3.11.9 (#92).
      # Remove this when we move to Python 3.12+.
      - dependency-name: "numpy"
        versions: [">=2.5"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
