name: Checks

# Runs scripts/check.py on every pull request. The job name "checks" is the
# status check the main ruleset will require once the data bot pushes as a
# GitHub App (see plan section 28 step 5).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (pinned to a commit)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (pinned to a commit)
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-dev.txt

      - name: Install check tools
        run: pip install -r scripts/requirements-dev.txt

      - name: Run checks
        run: python scripts/check.py
