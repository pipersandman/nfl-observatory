name: Update NFL Data

on:
  # Run every Tuesday at 6:00 AM UTC (after Monday Night Football)
  schedule:
    - cron: '0 6 * * 2'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Full historical rebuild (2020-present)'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      
      # 3. Install dependencies
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      
      # 4. Run data update script
      - name: Update data
        run: |
          if [ "${{ github.event.inputs.full_rebuild }}" == "true" ]; then
            echo "Running full rebuild..."
            python scripts/update_data.py --full
          else
            echo "Running incremental update..."
            python scripts/update_data.py
          fi
      
      # 5. Commit updated data files
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/data/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🏈 Update NFL data - $(date +'%Y-%m-%d')"
            git push
          fi
      
      # 6. Deploy to HostGator via FTP
      - name: Deploy to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}  # e.g., /public_html/nfl/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/_*.csv
